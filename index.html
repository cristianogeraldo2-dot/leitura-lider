<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#FBF4E3"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Liderança"/>
<title>Leitura Diária do Líder</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#FBF4E3;font-family:'Lato',sans-serif;color:#2A1F0E;min-height:100vh;}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#8B601060;border-radius:4px}
.serif{font-family:'Cormorant Garamond',serif;}
.screen{display:none;min-height:100vh;}
.screen.active{display:block;}
.max{max-width:460px;margin:0 auto;}

/* ONBOARDING */
.ob-wrap{padding:32px 22px 80px;max-width:440px;margin:0 auto;}
.progress-bar{background:#D9CCB0;border-radius:10px;height:5px;margin-bottom:22px;}
.progress-fill{background:#8B6010;height:100%;border-radius:10px;transition:width .4s;}
.progress-label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:10px;color:#8C7550;}
.ob-title{font-size:28px;font-weight:400;color:#2A1F0E;margin-bottom:6px;}
.ob-sub{font-size:13px;color:#8C7550;margin-bottom:20px;line-height:1.7;}
.field-label{font-size:10px;letter-spacing:2px;color:#8B6010;text-transform:uppercase;font-weight:700;margin-bottom:6px;}
.field-wrap{margin-bottom:18px;}
input[type=text],input[type=time]{width:100%;padding:13px 14px;background:#fff;border:1.5px solid #D9CCB0;border-radius:10px;font-size:16px;color:#2A1F0E;font-family:'Lato',sans-serif;outline:none;-webkit-appearance:none;}
input:focus{border-color:#8B6010;}
.opt-card{display:flex;align-items:center;gap:12px;padding:13px 16px;background:#F3EAD0;border:2px solid #D9CCB0;border-radius:12px;cursor:pointer;margin-bottom:8px;transition:all .2s;}
.opt-card.sel{background:#F5E6BE;border-color:#8B6010;}
.opt-card .opt-ic{font-size:22px;}
.opt-card .opt-name{font-size:14px;font-weight:700;color:#2A1F0E;}
.opt-card.sel .opt-name{color:#8B6010;}
.opt-card .opt-desc{font-size:11px;color:#8C7550;margin-top:2px;}
.opt-card .chk{margin-left:auto;color:#8B6010;font-size:18px;display:none;}
.opt-card.sel .chk{display:block;}
.days-grid{display:flex;gap:8px;margin-bottom:20px;}
.day-btn{flex:1;padding:12px;text-align:center;border-radius:10px;cursor:pointer;background:#F3EAD0;border:2px solid #D9CCB0;transition:all .2s;}
.day-btn.sel{background:#F5E6BE;border-color:#8B6010;}
.day-btn .dn{font-size:20px;font-weight:700;color:#2A1F0E;}
.day-btn.sel .dn{color:#8B6010;}
.day-btn .ds{font-size:9px;color:#8C7550;}
.btn-wrap{display:flex;gap:10px;margin-top:28px;}
.btn-back{flex:1;padding:14px;background:#F3EAD0;border:1.5px solid #D9CCB0;border-radius:12px;font-family:'Lato',sans-serif;font-size:15px;color:#5C4A2A;cursor:pointer;font-weight:700;}
.btn-next{flex:2;padding:14px;background:#8B6010;border:none;border-radius:12px;font-family:'Lato',sans-serif;font-size:15px;color:#fff;font-weight:700;cursor:pointer;}
.btn-next:disabled{background:#D9CCB0;cursor:not-allowed;}
.gold-box{background:#F5E6BE;border-left:3px solid #8B6010;border-radius:0 10px 10px 0;padding:14px 18px;}

/* APP */
.app-header{padding:20px 20px 16px;background:#EDE0C4;border-bottom:2px solid #D9CCB0;}
.tabs{display:flex;border-bottom:2px solid #D9CCB0;background:#F3EAD0;position:sticky;top:0;z-index:10;}
.tab{background:transparent;border:none;cursor:pointer;padding:8px 0;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tab.on{background:#F5E6BE;}
.tab .tic{font-size:15px;}
.tab .tlb{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:#8C7550;font-weight:700;}
.tab.on .tlb{color:#8B6010;}
.tab .thr{font-size:8px;color:#D9CCB0;}
.tab.on .thr{color:#8B601080;}
.content{padding:4px 20px 100px;background:#FBF4E3;}
.sec-label{font-size:9px;letter-spacing:2.5px;color:#8C7550;text-transform:uppercase;margin-bottom:14px;margin-top:26px;border-bottom:1px solid #D9CCB0;padding-bottom:8px;font-weight:700;}
.card{background:#F3EAD0;border:1px solid #D9CCB0;border-radius:12px;padding:16px 18px;margin-bottom:12px;}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.card-ic{font-size:22px;}
.card-title{font-size:10px;color:#8B6010;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;}
.card-sub{font-size:10px;color:#8C7550;margin-top:1px;}
.card-body{font-size:15px;line-height:1.85;color:#5C4A2A;}
.pbox{background:#F5E6BE;border-left:3px solid #8B6010;border-radius:0 10px 10px 0;padding:16px 20px;margin-top:20px;}
.pbox-label{font-size:9px;letter-spacing:2px;color:#8B6010;text-transform:uppercase;margin-bottom:8px;font-weight:700;}
.pbox-text{font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;line-height:1.7;color:#2A1F0E;}
.chk-item{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid #D9CCB0;cursor:pointer;}
.chk-circle{width:22px;height:22px;border-radius:50%;flex-shrink:0;margin-top:1px;border:2px solid #8B6010;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.chk-circle.done{background:#8B6010;border-color:#8B6010;}
.chk-circle.done::after{content:'✓';color:#fff;font-size:12px;font-weight:700;}
.chk-txt{font-size:15px;line-height:1.65;color:#2A1F0E;}
.chk-item.done-item .chk-txt{color:#8C7550;text-decoration:line-through;}
.frase-box{margin-top:14px;padding:13px 16px;background:#F3EAD0;border:1px solid #D9CCB0;border-left:3px solid #8B6010;border-radius:0 10px 10px 0;}
.ensino-box{background:#F3EAD0;border:1px solid #D9CCB0;border-radius:14px;padding:20px;}
.tag{display:inline-block;background:#F5E6BE;color:#8B6010;border-radius:20px;padding:3px 14px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-bottom:14px;}
.treino-header{background:#8B250008;border:1.5px solid #8B250030;border-radius:14px;padding:18px 20px;margin-bottom:16px;}
.treino-table{background:#F3EAD0;border:1px solid #D9CCB0;border-radius:12px;overflow:hidden;margin-bottom:12px;}
.treino-th{display:grid;grid-template-columns:1fr 90px 55px;padding:10px 16px;background:#EDE0C4;border-bottom:1px solid #D9CCB0;}
.treino-td{display:grid;grid-template-columns:1fr 90px 55px;padding:13px 16px;border-bottom:1px solid #D9CCB0;}
.treino-td:last-child{border-bottom:none;}
.treino-td.alt{background:#FBF4E3;}
.pilar-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.pilar-card{cursor:pointer;border-radius:10px;padding:12px;border:1px solid #D9CCB0;background:#F3EAD0;transition:all .2s;}
.pilar-card.active{background:#8B601010;}
.pilar-dot{width:8px;height:8px;border-radius:50%;margin-bottom:7px;}
.pilar-name{font-size:12px;font-weight:700;color:#2A1F0E;}
.pilar-card.active .pilar-name{color:#8B6010;}
.pilar-desc{font-size:12px;line-height:1.6;color:#5C4A2A;margin-top:5px;display:none;}
.pilar-card.active .pilar-desc{display:block;}
textarea{width:100%;padding:10px 12px;background:#fff;border:1.5px solid #D9CCB0;border-radius:8px;font-size:14px;color:#2A1F0E;font-family:'Lato',sans-serif;outline:none;resize:none;line-height:1.6;margin-bottom:8px;transition:border .2s;}
textarea:focus,textarea.filled{border-color:#8B6010;}
.save-btn{width:100%;padding:14px;background:#8B6010;border:none;border-radius:12px;font-family:'Lato',sans-serif;font-size:15px;color:#fff;font-weight:700;cursor:pointer;margin-bottom:4px;}
.saved-box{background:#F0FFF4;border:1.5px solid #2A5C3A;border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.prog-bar{background:#D9CCB0;border-radius:10px;height:4px;width:66px;}
.prog-fill{background:#8B6010;height:100%;border-radius:10px;transition:width .5s;}
.week-grid{display:flex;gap:6px;}
.week-day{flex:1;text-align:center;padding:8px 4px;border-radius:8px;}
.week-day.treino-day{background:#F3EAD0;border:1px solid #D9CCB0;}
.week-day.hoje{background:#8B6010;border:none;}
.red-box{background:#FFF0EB;border-left:3px solid #8B2500;border-radius:0 10px 10px 0;padding:16px 20px;margin-top:20px;}
.footer{margin-top:44px;text-align:center;padding-top:24px;border-top:2px solid #D9CCB0;}
.conf-screen{min-height:100vh;background:#FBF4E3;max-width:440px;margin:0 auto;padding:32px 22px 80px;}
.conf-row{display:flex;justify-content:space-between;padding:12px 16px;background:#F3EAD0;border:1px solid #D9CCB0;border-radius:10px;margin-bottom:8px;}
.reset-btn{width:100%;margin-top:20px;padding:14px;background:#FFF0EB;border:1.5px solid #8B250040;border-radius:12px;font-family:'Lato',sans-serif;font-size:14px;color:#8B2500;cursor:pointer;font-weight:700;}
.descanso-box{text-align:center;padding:40px 20px;}
</style>
</head>

function gerarTreino(cfg, diaS){
  const eq = cfg.equipamento==="gym"?"_gym":cfg.equipamento==="home"?"_home":"_body";
  const n = parseInt(cfg.diasTreino);
  const mapas = {
    3:{1:"full",3:"full",5:"full"},
    4:{1:"peito+triceps",2:"pernas",4:"costas+biceps",5:"ombros+hiit"},
    5:{1:"peito+triceps",2:"pernas",3:"costas+biceps",4:"ombros",5:"hiit"},
    6:{1:"peito+triceps",2:"pernas",3:"costas+biceps",4:"ombros+hiit",5:"peito+triceps",6:"pernas"},
  };
  const mapa = mapas[n]||mapas[3];
  const tipo = mapa[diaS];
  if(!tipo) return null;
  let exs=[];
  if(tipo==="full") exs=EX["full"+eq]||EX.full_body;
  else if(tipo.includes("hiit")) exs=EX["hiit"+eq]||EX.hiit_body;
  else {
    tipo.split("+").forEach(g=>{
      const k=g+eq;
      if(EX[k]) exs=[...exs,...EX[k].slice(0,3)];
    });
  }
  if(cfg.nivel==="iniciante") exs=exs.slice(0,4);
  else if(cfg.nivel==="avancado") exs=exs.map(e=>{
    const m=e[1].match(/^(\d+)x/);
    return m?[e[0],(parseInt(m[1])+1)+"x"+e[1].slice(m[0].length),e[2]]:e;
  });
  const nomes={"full":"Treino Full Body","peito+triceps":"Peito + Tríceps","pernas":"Pernas","costas+biceps":"Costas + Bíceps","ombros":"Ombros","ombros+hiit":"Ombros + HIIT","hiit":"HIIT Cardio"};
  const objTxt={emagrecer:"🔥 Queima de gordura",hipertrofia:"💪 Ganho muscular",condicionamento:"⚡ Condicionamento",saude:"💚 Saúde e bem-estar"}[cfg.objetivo]||"";
  return{nome:nomes[tipo]||tipo,objTxt,exs};
}

function saveDiario(campo,val){
  diario[campo]=val;
  salvarDiario();
}

function fecharDia(){
  // Captura valores antes de salvar
  const ids={g1:"d-g1",g2:"d-g2",g3:"d-g3",aprendizado:"d-ap",melhoria:"d-me",intencao:"d-in"};
  Object.entries(ids).forEach(([k,id])=>{const el=document.getElementById(id);if(el)diario[k]=el.value;});
  salvarDiario();
  diarioSalvo=true;
  renderContent();
}

function togglePilar(i){
  pilarAtivo=pilarAtivo===i?-1:i;
  renderContent();
}

function showConf(){
  const p=PERFIS[cfg.perfil]||PERFIS.lider;
  document.getElementById("conf-screen").innerHTML=`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <button onclick="show('s-app');renderApp()" style="background:none;border:none;cursor:pointer;font-size:22px;color:#8B6010">←</button>
      <h2 class="serif" style="font-size:26px;font-weight:400;color:#2A1F0E">Configurações</h2>
    </div>

      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">

          <p style="font-size:9px;color:#8C7550;text-transform:uppercase;letter-spacing:1.5px;font-weight:700">${p.nome}</p>

      ["Nível",{iniciante:"Iniciante",intermediario:"Intermediário",avancado:"Avançado"}[cfg.nivel]||cfg.nivel],
      ["Dias/semana",cfg.diasTreino+" dias"],
      ["Equipamento",{gym:"Academia",home:"Casa c/ halteres",body:"Sem equipamento"}[cfg.equipamento]||cfg.equipamento],
      ["Trabalho",`${cfg.trabInicio} → ${cfg.trabFim}`],
      [cfg.treinoLabel,cfg.academiaHora],
    ].map(([l,v])=>`<div class="conf-row"><span style="font-size:13px;color:#5C4A2A">${l}</span><span style="font-size:14px;font-weight:700;color:#8B6010">${v}</span></div>`).join("")}
    <button class="reset-btn" onclick="resetar()">Reconfigurar do zero</button>
    <button class="reset-btn" style="margin-top:10px" onclick="authLogout()">Sair da conta</button>`;

function resetar(){
  try{localStorage.removeItem("ldr_cfg");localStorage.removeItem("ldr_checks");localStorage.removeItem("ldr_diario");}catch(e){}
  cfg=null; checks={}; diario={g1:"",g2:"",g3:"",aprendizado:"",melhoria:"",intencao:""};
  obStep=0; obDados={nome:"",empresa:"",perfil:"lider",acordar:"04:30",trabInicio:"06:00",trabFim:"17:00",familiaLabel:"Família",academiaHora:"20:00",treinoLabel:"Academia",objetivo:"hipertrofia",nivel:"intermediario",diasTreino:"4",equipamento:"gym"};
  obRender();
  show("s-ob");
}

// ── AUTENTICAÇÃO ─────────────────────────────────────────────────────────────
let authMode="login", authErro="", authCarregando=false;

function authRender(){
  const w=document.getElementById("auth-wrap");
  let h=`<div style="text-align:center;padding:40px 0 24px">
    <div style="font-size:48px;margin-bottom:12px">🔐</div>
    <h1 class="serif" style="font-size:28px;font-weight:400;color:#2A1F0E;margin-bottom:6px">${authMode==="login"?"Entrar":"Criar conta"}</h1>
    <p style="font-size:13px;color:#8C7550">Acesse sua Leitura Diária do Líder</p>
  </div>`;
  if(authErro) h+=`<div class="red-box" style="margin-bottom:16px;margin-top:0"><p style="font-size:13px;color:#8B2500">${authErro}</p></div>`;
  h+=`<div class="field-wrap"><div class="field-label">Email</div><input type="text" id="auth-email" placeholder="voce@email.com" autocomplete="email"/></div>
  <div class="field-wrap"><div class="field-label">Senha</div><input type="password" id="auth-senha" placeholder="••••••••" autocomplete="${authMode==="login"?"current-password":"new-password"}"/></div>
  <button class="btn-next" style="width:100%" onclick="authSubmit()" ${authCarregando?"disabled":""}>${authCarregando?"Aguarde...":authMode==="login"?"Entrar":"Criar conta"}</button>
  <p style="text-align:center;font-size:13px;color:#8C7550;margin-top:16px;cursor:pointer" onclick="authToggle()">${authMode==="login"?"Não tem conta? Criar conta":"Já tem conta? Entrar"}</p>`;
  w.innerHTML=h;
}

function authToggle(){authMode=authMode==="login"?"cadastro":"login";authErro="";authRender();}

async function authSubmit(){
  const email=(document.getElementById("auth-email").value||"").trim();
  const senha=document.getElementById("auth-senha").value||"";
  if(!email||!senha){authErro="Preencha email e senha.";authRender();return;}
  authErro="";authCarregando=true;authRender();
  const {error} = authMode==="login"
    ? await sb.auth.signInWithPassword({email,password:senha})
    : await sb.auth.signUp({email,password:senha});
  authCarregando=false;
  if(error){authErro=error.message;authRender();return;}
  if(authMode==="cadastro"){
    authErro="Conta criada! Verifique seu email para confirmar e depois faça login.";
    authMode="login";
    authRender();
  }
  // login bem-sucedido: onAuthStateChange assume o resto
}

function authLogout(){sb.auth.signOut();}

function iniciarApp(){
  carregar();
  if(cfg){
    const h=new Date().getHours(), ph=s=>parseInt(s.split(":")[0]);
    if(h>=ph(cfg.acordar)&&h<ph(cfg.trabInicio)) abaAtual="manha";
    else if(h>=ph(cfg.trabInicio)&&h<ph(cfg.trabFim)) abaAtual="trab";
    else if(h>=ph(cfg.trabFim)&&h<ph(cfg.trabFim)+1) abaAtual="financas";
    else if(h>=ph(cfg.trabFim)+1&&h<ph(cfg.academiaHora)) abaAtual="fam";
    else if(h>=ph(cfg.academiaHora)&&h<ph(cfg.academiaHora)+1) abaAtual="treino";
    else abaAtual="noite";
    renderApp();
    show("s-app");
  } else {
    obRender();
    show("s-ob");
  }
}

// ── INIT ─────────────────────────────────────────────────────────────────────
sb.auth.onAuthStateChange((event,session)=>{
  if(session) iniciarApp();
  else { authMode="login";authErro="";authCarregando=false; authRender(); show("s-auth"); }
});
</script>
