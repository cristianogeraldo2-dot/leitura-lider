<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#FBF4E3;font-family:'Lato',sans-serif;color:#2A1F0E;min-height:100vh;}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#8B601060;border-radius:4px}
.serif{font-family:'Cormorant Garamond',serif;}
.screen{display:none;min-height:100vh;}
.screen.active{display:block;}
.max{max-width:460px;margin:0 auto;}

/* ONBOARDING */
.ob-wrap{padding:32px 22px 80px;max-width:440px;margin:0 auto;}
.progress-bar{background:#D9CCB0;border-radius:10px;height:5px;margin-bottom:22px;}
.progress-fill{background:#8B6010;height:100%;border-radius:10px;transition:width .4s;}
.progress-label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:10px;color:#8C7550;}
.ob-title{font-size:28px;font-weight:400;color:#2A1F0E;margin-bottom:6px;}
.ob-sub{font-size:13px;color:#8C7550;margin-bottom:20px;line-height:1.7;}
.field-label{font-size:10px;letter-spacing:2px;color:#8B6010;text-transform:uppercase;font-weight:700;margin-bottom:6px;}
.field-wrap{margin-bottom:18px;}
input[type=text],input[type=time]{width:100%;padding:13px 14px;background:#fff;border:1.5px solid #D9CCB0;border-radius:10px;font-size:16px;color:#2A1F0E;font-family:'Lato',sans-serif;outline:none;-webkit-appearance:none;}
input:focus{border-color:#8B6010;}
.opt-card{display:flex;align-items:center;gap:12px;padding:13px 16px;background:#F3EAD0;border:2px solid #D9CCB0;border-radius:12px;cursor:pointer;margin-bottom:8px;transition:all .2s;}
.opt-card.sel{background:#F5E6BE;border-color:#8B6010;}
.opt-card .opt-ic{font-size:22px;}
.opt-card .opt-name{font-size:14px;font-weight:700;color:#2A1F0E;}
.opt-card.sel .opt-name{color:#8B6010;}
.opt-card .opt-desc{font-size:11px;color:#8C7550;margin-top:2px;}
.opt-card .chk{margin-left:auto;color:#8B6010;font-size:18px;display:none;}
.opt-card.sel .chk{display:block;}
.days-grid{display:flex;gap:8px;margin-bottom:20px;}
.day-btn{flex:1;padding:12px;text-align:center;border-radius:10px;cursor:pointer;background:#F3EAD0;border:2px solid #D9CCB0;transition:all .2s;}
.day-btn.sel{background:#F5E6BE;border-color:#8B6010;}
.day-btn .dn{font-size:20px;font-weight:700;color:#2A1F0E;}
.day-btn.sel .dn{color:#8B6010;}
.day-btn .ds{font-size:9px;color:#8C7550;}
.btn-wrap{display:flex;gap:10px;margin-top:28px;}
.btn-back{flex:1;padding:14px;background:#F3EAD0;border:1.5px solid #D9CCB0;border-radius:12px;font-family:'Lato',sans-serif;font-size:15px;color:#5C4A2A;cursor:pointer;font-weight:700;}
.btn-next{flex:2;padding:14px;background:#8B6010;border:none;border-radius:12px;font-family:'Lato',sans-serif;font-size:15px;color:#fff;font-weight:700;cursor:pointer;}
.btn-next:disabled{background:#D9CCB0;cursor:not-allowed;}
.gold-box{background:#F5E6BE;border-left:3px solid #8B6010;border-radius:0 10px 10px 0;padding:14px 18px;}

/* APP */
.app-header{padding:20px 20px 16px;background:#EDE0C4;border-bottom:2px solid #D9CCB0;}
.tabs{display:flex;border-bottom:2px solid #D9CCB0;background:#F3EAD0;position:sticky;top:0;z-index:10;}
.tab{background:transparent;border:none;cursor:pointer;padding:8px 0;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tab.on{background:#F5E6BE;}
.tab .tic{font-size:15px;}
.tab .tlb{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:#8C7550;font-weight:700;}
.tab.on .tlb{color:#8B6010;}
.tab .thr{font-size:8px;color:#D9CCB0;}
.tab.on .thr{color:#8B601080;}
.content{padding:4px 20px 100px;background:#FBF4E3;}
.sec-label{font-size:9px;letter-spacing:2.5px;color:#8C7550;text-transform:uppercase;margin-bottom:14px;margin-top:26px;border-bottom:1px solid #D9CCB0;padding-bottom:8px;font-weight:700;}
.card{background:#F3EAD0;border:1px solid #D9CCB0;border-radius:12px;padding:16px 18px;margin-bottom:12px;}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.card-ic{font-size:22px;}
.card-title{font-size:10px;color:#8B6010;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;}
.card-sub{font-size:10px;color:#8C7550;margin-top:1px;}
.card-body{font-size:15px;line-height:1.85;color:#5C4A2A;}
.pbox{background:#F5E6BE;border-left:3px solid #8B6010;border-radius:0 10px 10px 0;padding:16px 20px;margin-top:20px;}
.pbox-label{font-size:9px;letter-spacing:2px;color:#8B6010;text-transform:uppercase;margin-bottom:8px;font-weight:700;}
.pbox-text{font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;line-height:1.7;color:#2A1F0E;}
.chk-item{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid #D9CCB0;cursor:pointer;}
.chk-circle{width:22px;height:22px;border-radius:50%;flex-shrink:0;margin-top:1px;border:2px solid #8B6010;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.chk-circle.done{background:#8B6010;border-color:#8B6010;}
.chk-circle.done::after{content:'✓';color:#fff;font-size:12px;font-weight:700;}
.chk-txt{font-size:15px;line-height:1.65;color:#2A1F0E;}
.chk-item.done-item .chk-txt{color:#8C7550;text-decoration:line-through;}
.frase-box{margin-top:14px;padding:13px 16px;background:#F3EAD0;border:1px solid #D9CCB0;border-left:3px solid #8B6010;border-radius:0 10px 10px 0;}
.ensino-box{background:#F3EAD0;border:1px solid #D9CCB0;border-radius:14px;padding:20px;}
.tag{display:inline-block;background:#F5E6BE;color:#8B6010;border-radius:20px;padding:3px 14px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-bottom:14px;}
.treino-header{background:#8B250008;border:1.5px solid #8B250030;border-radius:14px;padding:18px 20px;margin-bottom:16px;}
.treino-table{background:#F3EAD0;border:1px solid #D9CCB0;border-radius:12px;overflow:hidden;margin-bottom:12px;}
.treino-th{display:grid;grid-template-columns:1fr 90px 55px;padding:10px 16px;background:#EDE0C4;border-bottom:1px solid #D9CCB0;}
.treino-td{display:grid;grid-template-columns:1fr 90px 55px;padding:13px 16px;border-bottom:1px solid #D9CCB0;}
.treino-td:last-child{border-bottom:none;}
.treino-td.alt{background:#FBF4E3;}
.pilar-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.pilar-card{cursor:pointer;border-radius:10px;padding:12px;border:1px solid #D9CCB0;background:#F3EAD0;transition:all .2s;}
.pilar-card.active{background:#8B601010;}
.pilar-dot{width:8px;height:8px;border-radius:50%;margin-bottom:7px;}
.pilar-name{font-size:12px;font-weight:700;color:#2A1F0E;}
.pilar-card.active .pilar-name{color:#8B6010;}
.pilar-desc{font-size:12px;line-height:1.6;color:#5C4A2A;margin-top:5px;display:none;}
.pilar-card.active .pilar-desc{display:block;}
textarea{width:100%;padding:10px 12px;background:#fff;border:1.5px solid #D9CCB0;border-radius:8px;font-size:14px;color:#2A1F0E;font-family:'Lato',sans-serif;outline:none;resize:none;line-height:1.6;margin-bottom:8px;transition:border .2s;}
textarea:focus,textarea.filled{border-color:#8B6010;}
.save-btn{width:100%;padding:14px;background:#8B6010;border:none;border-radius:12px;font-family:'Lato',sans-serif;font-size:15px;color:#fff;font-weight:700;cursor:pointer;margin-bottom:4px;}
.saved-box{background:#F0FFF4;border:1.5px solid #2A5C3A;border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.prog-bar{background:#D9CCB0;border-radius:10px;height:4px;width:66px;}
.prog-fill{background:#8B6010;height:100%;border-radius:10px;transition:width .5s;}
.week-grid{display:flex;gap:6px;}
.week-day{flex:1;text-align:center;padding:8px 4px;border-radius:8px;}
.week-day.treino-day{background:#F3EAD0;border:1px solid #D9CCB0;}
.week-day.hoje{background:#8B6010;border:none;}
.red-box{background:#FFF0EB;border-left:3px solid #8B2500;border-radius:0 10px 10px 0;padding:16px 20px;margin-top:20px;}
.footer{margin-top:44px;text-align:center;padding-top:24px;border-top:2px solid #D9CCB0;}
.conf-screen{min-height:100vh;background:#FBF4E3;max-width:440px;margin:0 auto;padding:32px 22px 80px;}
.conf-row{display:flex;justify-content:space-between;padding:12px 16px;background:#F3EAD0;border:1px solid #D9CCB0;border-radius:10px;margin-bottom:8px;}
.reset-btn{width:100%;margin-top:20px;padding:14px;background:#FFF0EB;border:1.5px solid #8B250040;border-radius:12px;font-family:'Lato',sans-serif;font-size:14px;color:#8B2500;cursor:pointer;font-weight:700;}
.descanso-box{text-align:center;padding:40px 20px;}
</style>
</head>

function gerarTreino(cfg, diaS){
  const eq = cfg.equipamento==="gym"?"_gym":cfg.equipamento==="home"?"_home":"_body";
  const n = parseInt(cfg.diasTreino);
  const mapas = {
    3:{1:"full",3:"full",5:"full"},
    4:{1:"peito+triceps",2:"pernas",4:"costas+biceps",5:"ombros+hiit"},
    5:{1:"peito+triceps",2:"pernas",3:"costas+biceps",4:"ombros",5:"hiit"},
    6:{1:"peito+triceps",2:"pernas",3:"costas+biceps",4:"ombros+hiit",5:"peito+triceps",6:"pernas"},
  };
  const mapa = mapas[n]||mapas[3];
  const tipo = mapa[diaS];
  if(!tipo) return null;
  let exs=[];
  if(tipo==="full") exs=EX["full"+eq]||EX.full_body;
  else if(tipo.includes("hiit")) exs=EX["hiit"+eq]||EX.hiit_body;
  else {
    tipo.split("+").forEach(g=>{
      const k=g+eq;
      if(EX[k]) exs=[...exs,...EX[k].slice(0,3)];
    });
  }
  if(cfg.nivel==="iniciante") exs=exs.slice(0,4);
  else if(cfg.nivel==="avancado") exs=exs.map(e=>{
    const m=e[1].match(/^(\d+)x/);
    return m?[e[0],(parseInt(m[1])+1)+"x"+e[1].slice(m[0].length),e[2]]:e;
  });
  const nomes={"full":"Treino Full Body","peito+triceps":"Peito + Tríceps","pernas":"Pernas","costas+biceps":"Costas + Bíceps","ombros":"Ombros","ombros+hiit":"Ombros + HIIT","hiit":"HIIT Cardio"};
  const objTxt={emagrecer:"🔥 Queima de gordura",hipertrofia:"💪 Ganho muscular",condicionamento:"⚡ Condicionamento",saude:"💚 Saúde e bem-estar"}[cfg.objetivo]||"";
  return{nome:nomes[tipo]||tipo,objTxt,exs};
}

function fmtRelativo(iso){
  if(!iso) return "nunca sincronizado";
  const diffMs=Date.now()-new Date(iso).getTime();
  const min=Math.floor(diffMs/60000);
  if(min<1) return "agora mesmo";
  if(min<60) return `há ${min} min`;
  const h=Math.floor(min/60);
  if(h<24) return `há ${h}h`;
  const d=Math.floor(h/24);
  return `há ${d} dia${d>1?"s":""}`;
}

function calcularOrcadoRealizado(df){
  const nomes=new Set([...(df.categorias||[]).map(c=>c.nome),...Object.keys(df.mediaHistPorCat||{})]);
  const hoje=new Date();
  const diasNoMes=new Date(hoje.getFullYear(),hoje.getMonth()+1,0).getDate();
  const diaAtual=hoje.getDate();
  const linhas=[...nomes].map(nome=>{
    const realizado=((df.categorias||[]).find(c=>c.nome===nome)||{}).total||0;
    const mediaHist=(df.mediaHistPorCat||{})[nome]||0;
    const temManual=orcamentos[nome]!=null;
    const orcado=temManual?orcamentos[nome]:mediaHist;
    const variacaoValor=realizado-orcado;
    const variacaoPct=orcado>0?(variacaoValor/orcado*100):null;
    const restante=Math.max(0,orcado-realizado);
    const previsaoFechamento=diaAtual>0?(realizado/diaAtual*diasNoMes):realizado;
    let semaforo="verde";
    if(orcado>0){
      const pct=realizado/orcado;
      if(pct>1) semaforo="vermelho"; else if(pct>=0.8) semaforo="amarelo";
    } else if(realizado>0) semaforo="amarelo";
    return {nome,orcado,realizado,variacaoValor,variacaoPct,restante,previsaoFechamento,semaforo,temManual};
  }).sort((a,b)=>b.realizado-a.realizado);
  const totalOrcado=linhas.reduce((s,l)=>s+l.orcado,0);
  const totalRealizado=linhas.reduce((s,l)=>s+l.realizado,0);
  const utilizacaoTotal=totalOrcado>0?(totalRealizado/totalOrcado*100):null;
  const maioresEstouros=linhas.filter(l=>l.variacaoValor>0).sort((a,b)=>b.variacaoValor-a.variacaoValor).slice(0,3);
  const previsaoTotalFechamento=diaAtual>0?(totalRealizado/diaAtual*diasNoMes):totalRealizado;
  return {linhas,totalOrcado,totalRealizado,utilizacaoTotal,maioresEstouros,previsaoTotalFechamento};
}

// Projeção diária simplificada: gasto médio histórico distribuído linearmente por dia, sem inventar
// datas de vencimento (o banco não tem essa informação). Pagamento da dívida do mês é aplicado no
// dia 10 como aproximação — não é a data real de vencimento de cada dívida.
function calcularProjecaoCaixa(saldoInicial,gastoDiarioMedio,rendas,cronograma,saldoMinimo){
  const dias=[];
  let saldo=saldoInicial;
  const hoje=new Date();
  const diaAtualDoMes=hoje.getDate();
  for(let i=0;i<90;i++){
    const data=new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate()+i);
    const diaDoMes=data.getDate();
    const mesIndex=(data.getFullYear()-hoje.getFullYear())*12+(data.getMonth()-hoje.getMonth());
    let entrada=0;
    (rendas||[]).forEach(r=>{
      const dur=r.meses==null||r.meses===""?null:Number(r.meses);
      const diaAlvo=r.dia||1;
      if(dur!=null&&mesIndex>=dur) return;
      // Se o dia-alvo deste mês já passou (mês atual), lança no primeiro dia da projeção em vez de pular o mês inteiro.
      if(mesIndex===0&&diaAtualDoMes>diaAlvo){ if(i===0) entrada+=Number(r.valor||0); }
      else if(diaDoMes===diaAlvo) entrada+=Number(r.valor||0);
    });
    let saidaDivida=0;
    const pagamentoMes=(cronograma&&cronograma[mesIndex])?Object.values(cronograma[mesIndex].pagamentos).reduce((s,v)=>s+v,0):0;
    if(mesIndex===0&&diaAtualDoMes>10){ if(i===0) saidaDivida=pagamentoMes; }
    else if(diaDoMes===10) saidaDivida=pagamentoMes;
    saldo=saldo+entrada-gastoDiarioMedio-saidaDivida;
    dias.push({data,saldo,abaixoMinimo:saldo<saldoMinimo,negativo:saldo<0});
  }
  return dias;
}

// Snowball: cheque especial primeiro (juro mais alto quase sempre no Brasil), depois cartões do menor pro maior.
function calcularQuitacao(contas,valorMensal,extraOverride){
  const dividas=[];
  (contas||[]).forEach(a=>{
    const bal=Number(a.balance||0);
    if(a.account_type==="checking"&&bal<0){
      dividas.push({nome:"Cheque especial"+(a.institution_label?` (${a.institution_label})`:""),valor:-bal,tipo:"cheque"});
    } else if((a.account_type==="credit_card"||a.account_type==="loan"||a.account_type==="financing")&&bal>0){
      dividas.push({nome:a.name||"Cartão/Empréstimo",valor:bal,tipo:"cartao"});
    }
  });
  dividas.sort((a,b)=>{
    if(a.tipo==="cheque"&&b.tipo!=="cheque") return -1;
    if(b.tipo==="cheque"&&a.tipo!=="cheque") return 1;
    return a.valor-b.valor;
  });
  const totalDivida=dividas.reduce((s,d)=>s+d.valor,0);
  const extraTotal=extraOverride!==undefined?extraOverride:(planoDivida.extras||[]).reduce((s,e)=>s+Number(e.valor||0),0);
  const bucket=dividas.map(d=>({...d}));
  const hoje=new Date(), cronograma=[];
  let totalRestante=totalDivida, mesesRestantes=0;
  while(totalRestante>0&&mesesRestantes<120){
    const dataM=new Date(hoje.getFullYear(),hoje.getMonth()+mesesRestantes,1);
    const label=`${MS[dataM.getMonth()]}/${String(dataM.getFullYear()).slice(2)}`;
    const rendaRecorrente=(planoDivida.rendas||[]).reduce((s,r)=>{
      const dur=r.meses===""||r.meses==null?null:Number(r.meses);
      return s+((dur==null||mesesRestantes<dur)?Number(r.valor||0):0);
    },0);
    const poolMes=valorMensal+rendaRecorrente+(mesesRestantes===0?extraTotal:0);
    const pagamentos={};
    let sobra=poolMes;
    for(let i=0;i<bucket.length&&sobra>0;i++){
      if(bucket[i].valor<=0) continue;
      const pag=Math.min(bucket[i].valor,sobra);
      if(pag>0) pagamentos[bucket[i].nome]=pag;
      bucket[i].valor-=pag; sobra-=pag;
    }
    cronograma.push({label,pagamentos});
    mesesRestantes++;
    totalRestante=bucket.reduce((s,d)=>s+Math.max(d.valor,0),0);
    if(poolMes<=0) break;
  }
  return {dividas,totalDivida,extraTotal,mesesRestantes,dividaAtual:dividas.length?dividas[0]:null,cronograma};
}

// Score 0-100: 40% endividamento (dívida/renda), 35% patrimônio (saldo/renda), 25% ritmo de gasto no ciclo.
// Não considera uso de limite de cartão porque essa informação não é sincronizada do Pluggy (regra: não inventar dado).
function calcularScore(totalDivida,saldoTotal,sc){
  if(!sc||!sc.monthly_income) return null;
  const renda=sc.monthly_income;
  const scoreDivida=Math.max(0,Math.min(100,100-(totalDivida/renda)*20));
  const scorePatrimonio=Math.max(0,Math.min(100,100+(saldoTotal/renda)*50));
  let scoreRitmo=100;
  if(sc.viver_amount>0) scoreRitmo=Math.max(0,Math.min(100,100-(sc.spent_so_far/sc.viver_amount)*100));
  const score=Math.round(scoreDivida*0.4+scorePatrimonio*0.35+scoreRitmo*0.25);
  return {score,scoreDivida:Math.round(scoreDivida),scorePatrimonio:Math.round(scorePatrimonio),scoreRitmo:Math.round(scoreRitmo)};
}

// Projeção linear: assume renda e ritmo de quitação constantes, sem juros novos nem dívida nova.
function calcularFluxoProjetado(patrimonioAtual,totalDivida,cronograma,valorMensal,renda){
  const marcos=[{m:1,label:"30 dias"},{m:2,label:"60 dias"},{m:3,label:"90 dias"},{m:6,label:"6 meses"},{m:12,label:"12 meses"},{m:24,label:"24 meses"}];
  const banda=renda?renda*0.2:1000;
  return marcos.map(({m,label})=>{
    let pago=0;
    for(let i=0;i<Math.min(m,cronograma.length);i++){
      pago+=Object.values(cronograma[i].pagamentos).reduce((s,v)=>s+v,0);
    }
    pago=Math.min(pago,totalDivida);
    const mesesLivre=Math.max(0,m-cronograma.length);
    const patrimonio=Math.round((patrimonioAtual+pago+mesesLivre*valorMensal)*100)/100;
    let status,cor;
    if(patrimonio<0){status="Déficit";cor="#8B2500";}
    else if(patrimonio<banda){status="Equilíbrio";cor="#8B6010";}
    else{status="Superávit";cor="#2A5C3A";}
    return {label,patrimonio,status,cor};
  });
}

    if(pct>=30) acoes.push({titulo:`Reduzir gastos em ${top.nome}`,detalhe:`Já representa ${pct}% de tudo que você gastou este mês (${fmtMoeda(top.total)}). Corte pelo menos 20% aqui.`,prioridade:"alta"});
  }
  if(scoreObj&&scoreObj.scoreRitmo<50&&sc){
    acoes.push({titulo:"Frear o ritmo de gastos do ciclo",detalhe:`Você já gastou ${fmtMoeda(sc.spent_so_far)} de ${fmtMoeda(sc.viver_amount)} disponíveis, com ${sc.days_remaining} dias restantes no ciclo.`,prioridade:"alta"});
  }
  (df.alertas||[]).filter(a=>(a.severity||"").toLowerCase()==="alta"||(a.severity||"").toLowerCase()==="high").forEach(a=>{
    acoes.push({titulo:`Resolver alerta: ${a.title||a.type}`,detalhe:a.message||"",prioridade:"alta"});
  });
  if(q.mesesRestantes>0){
    acoes.push({titulo:"Evitar qualquer compra parcelada nova",detalhe:`Cada parcela nova atrasa a saída do vermelho, prevista pra daqui a ${q.mesesRestantes} ${q.mesesRestantes===1?"mês":"meses"}.`,prioridade:"media"});
  }
  acoes.push({titulo:"Separar reserva assim que a dívida atual zerar",detalhe:q.dividas.length>1?`Depois de quitar ${q.dividaAtual?q.dividaAtual.nome:"a dívida atual"}, redirecione o valor mensal pra reserva antes de gastar mais.`:"Assim que ficar livre de dívida, comece a reserva no mesmo mês.",prioridade:"baixa"});
  const ordem={alta:0,media:1,baixa:2};
  return acoes.sort((a,b)=>ordem[a.prioridade]-ordem[b.prioridade]).slice(0,5);
}

    const inicioProxMes=new Date(hoje.getFullYear(),hoje.getMonth()+1,1).toISOString().slice(0,10);
    const inicio3Meses=new Date(hoje.getFullYear(),hoje.getMonth()-3,1).toISOString().slice(0,10);
    const [{data:accs},{data:ciclos},{data:txs},{data:alertas},{data:txsMes},{data:cats},{data:txsHist},{data:itens}] = await Promise.all([
      sb.from('accounts').select('balance,account_type,is_active,name,institution_label,masked_number').eq('is_active',true),
      sb.from('missao_5k_cycles').select('id,start_date').order('start_date',{ascending:false}).limit(1),
      sb.from('transactions').select('description,merchant_name,amount,date').order('date',{ascending:false}).limit(6),
      sb.from('alerts').select('id,type,severity,title,message,created_at').is('dismissed_at',null).order('created_at',{ascending:false}).limit(8),
      sb.from('transactions').select('amount,category_id,date').gte('date',inicioMes).lt('date',inicioProxMes),
      sb.from('categories').select('id,name'),
      sb.from('transactions').select('amount,category_id,date').gte('date',inicio3Meses).lt('date',inicioMes),
      sb.from('pluggy_items').select('connector_name,institution_label,last_synced_at,status').order('last_synced_at',{ascending:false}),
    ]);
    const catMap={};
    (cats||[]).forEach(c=>catMap[c.id]=c.name);
    const gastoPorCat={};
    (txsMes||[]).forEach(t=>{
      const v=Number(t.amount||0);
      if(v>=0) return; // só despesas (valores negativos)
      const nome=catMap[t.category_id]||"Sem categoria";
      gastoPorCat[nome]=(gastoPorCat[nome]||0)+(-v);
    });
    const categorias=Object.entries(gastoPorCat).map(([nome,total])=>({nome,total})).sort((a,b)=>b.total-a.total);
    const totalGastoMes=categorias.reduce((s,c)=>s+c.total,0);

    const gastoHistPorCat={};
    (txsHist||[]).forEach(t=>{
      const v=Number(t.amount||0);
      if(v>=0) return;
      const nome=catMap[t.category_id]||"Sem categoria";
      gastoHistPorCat[nome]=(gastoHistPorCat[nome]||0)+(-v);
    });
    const mediaHistPorCat={};
    Object.keys(gastoHistPorCat).forEach(nome=>{mediaHistPorCat[nome]=gastoHistPorCat[nome]/3;});
    const desperdicio=categorias.map(c=>{
      const media=mediaHistPorCat[c.nome]||0;
      const diferenca=c.total-media;
      return {nome:c.nome,atual:c.total,media,diferenca,impactoAnual:diferenca*12};
    }).filter(d=>d.diferenca>0&&d.media>0).sort((a,b)=>b.diferenca-a.diferenca);
    const ehPassivo=t=>t==="credit_card"||t==="loan"||t==="financing";
    // Cartão/empréstimo: o "balance" é o quanto você DEVE, então entra negativo no patrimônio.
    const saldoTotal=(accs||[]).reduce((s,a)=>{
      const bal=Number(a.balance||0);
      return s+(ehPassivo(a.account_type)?-bal:bal);
    },0);
    const dividaCartao=(accs||[]).filter(a=>ehPassivo(a.account_type)).reduce((s,a)=>s+Number(a.balance||0),0);
    let statusCiclo=null;
    if(ciclos&&ciclos[0]){
      const {data:st}=await sb.from('v_missao_5k_status').select('*').eq('cycle_id',ciclos[0].id).maybeSingle();
      statusCiclo=st;
    }
    dadosFinancas={saldoTotal,dividaCartao,statusCiclo,txs:txs||[],contasBrutas:accs||[],alertas:alertas||[],categorias,totalGastoMes,desperdicio,itens:itens||[],mediaHistPorCat};
  }catch(e){
    dadosFinancas=null;
  }
  financasCarregando=false;
  if(abaAtual==="financas") renderContent();
}

async function dispensarAlerta(id){
  if(dadosFinancas) dadosFinancas.alertas=(dadosFinancas.alertas||[]).filter(a=>a.id!==id);
  renderContent();
  try{ await sb.from('alerts').update({dismissed_at:new Date().toISOString()}).eq('id',id); }catch(e){}
}

function obLerCampos(){

function obAvancar(){
  obLerCampos();
  if(obStep<5){obStep++;obRender();}
  else{
    if(!obDados.nome.trim()) obDados.nome="Líder";
    cfg=Object.assign({},obDados);
    salvarCfg();
    const h=new Date().getHours(), ph=s=>parseInt(s.split(":")[0]);
    if(h>=ph(cfg.acordar)&&h<ph(cfg.trabInicio)) abaAtual="manha";
    else if(h>=ph(cfg.trabInicio)&&h<ph(cfg.trabFim)) abaAtual="trab";
    else if(h>=ph(cfg.trabFim)&&h<ph(cfg.trabFim)+1) abaAtual="financas";
    else if(h>=ph(cfg.trabFim)+1&&h<ph(cfg.academiaHora)) abaAtual="fam";
    else if(h>=ph(cfg.academiaHora)&&h<ph(cfg.academiaHora)+1) abaAtual="treino";
    else abaAtual="noite";
    renderApp();
    show("s-app");

}

function saveDiario(campo,val){
  diario[campo]=val;
  salvarDiario();
}

function fecharDia(){
  // Captura valores antes de salvar
  const ids={g1:"d-g1",g2:"d-g2",g3:"d-g3",aprendizado:"d-ap",melhoria:"d-me",intencao:"d-in"};
  Object.entries(ids).forEach(([k,id])=>{const el=document.getElementById(id);if(el)diario[k]=el.value;});
  salvarDiario();
  diarioSalvo=true;
  renderContent();
}

function togglePilar(i){
  pilarAtivo=pilarAtivo===i?-1:i;
  renderContent();
}

  if(authErro) h+=`<div class="red-box" style="margin-bottom:16px;margin-top:0"><p style="font-size:13px;color:#8B2500">${authErro}</p></div>`;
  h+=`<div class="field-wrap"><div class="field-label">Email</div><input type="text" id="auth-email" placeholder="voce@email.com" autocomplete="email"/></div>
  <div class="field-wrap"><div class="field-label">Senha</div><input type="password" id="auth-senha" placeholder="••••••••" autocomplete="${authMode==="login"?"current-password":"new-password"}"/></div>
  <button class="btn-next" style="width:100%" onclick="authSubmit()" ${authCarregando?"disabled":""}>${authCarregando?"Aguarde...":authMode==="login"?"Entrar":"Criar conta"}</button>
  <p style="text-align:center;font-size:13px;color:#8C7550;margin-top:16px;cursor:pointer" onclick="authToggle()">${authMode==="login"?"Não tem conta? Criar conta":"Já tem conta? Entrar"}</p>`;
  w.innerHTML=h;
}

function authToggle(){authMode=authMode==="login"?"cadastro":"login";authErro="";authRender();}

async function authSubmit(){
  const email=(document.getElementById("auth-email").value||"").trim();
  const senha=document.getElementById("auth-senha").value||"";
  if(!email||!senha){authErro="Preencha email e senha.";authRender();return;}
  authErro="";authCarregando=true;authRender();
  const {error} = authMode==="login"
    ? await sb.auth.signInWithPassword({email,password:senha})
    : await sb.auth.signUp({email,password:senha});
  authCarregando=false;
  if(error){authErro=error.message;authRender();return;}
  if(authMode==="cadastro"){
    authErro="Conta criada! Verifique seu email para confirmar e depois faça login.";
    authMode="login";
    authRender();
  }
  // login bem-sucedido: onAuthStateChange assume o resto
}

function authLogout(){sb.auth.signOut();}

function iniciarApp(){
  carregar();
  if(cfg){
    const h=new Date().getHours(), ph=s=>parseInt(s.split(":")[0]);
    if(h>=ph(cfg.acordar)&&h<ph(cfg.trabInicio)) abaAtual="manha";
    else if(h>=ph(cfg.trabInicio)&&h<ph(cfg.trabFim)) abaAtual="trab";
    else if(h>=ph(cfg.trabFim)&&h<ph(cfg.trabFim)+1) abaAtual="financas";
    else if(h>=ph(cfg.trabFim)+1&&h<ph(cfg.academiaHora)) abaAtual="fam";
    else if(h>=ph(cfg.academiaHora)&&h<ph(cfg.academiaHora)+1) abaAtual="treino";
    else abaAtual="noite";
    renderApp();
    show("s-app");
    if(abaAtual==="financas") carregarFinancas();
  } else {
    obRender();
    show("s-ob");
  }
}

// ── INIT ─────────────────────────────────────────────────────────────────────
sb.auth.onAuthStateChange((event,session)=>{
  if(session) iniciarApp();
  else { authMode="login";authErro="";authCarregando=false; authRender(); show("s-auth"); }
});
</script>
</body>
</html>
